// ============ CONSTANTS ============
const KG_PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
const BAR_KG = 20;
const DAY_LABELS = { 1: "PUSH", 2: "PULL", 3: "LEGS", 4: "UPPER", 5: "LOWER" };
const DAY_COLORS = {
  1: "#ff3b5c",  // push - red
  2: "#3b82f6",  // pull - blue
  3: "#22c55e",  // legs - green
  4: "#f5a524",  // upper - orange
  5: "#a855f7",  // lower - purple
};

// ============ HELPERS ============
function calcPlatesPerSide(totalKg) {
  if (totalKg == null || isNaN(totalKg)) return null;
  const num = Number(totalKg);
  if (num < BAR_KG) return null;
  let remaining = (num - BAR_KG) / 2;
  if (remaining === 0) return [];
  const plates = [];
  for (const p of KG_PLATES) {
    while (remaining >= p - 0.001) {
      plates.push(p);
      remaining = Math.round((remaining - p) * 1000) / 1000;
    }
  }
  if (remaining > 0.05) return null;
  return plates;
}

function platesToShort(plates) {
  if (!plates || plates.length === 0) return null;
  const counts = {};
  plates.forEach((p) => (counts[p] = (counts[p] || 0) + 1));
  return Object.entries(counts)
    .sort((a, b) => Number(b[0]) - Number(a[0]))
    .map(([p, c]) => (c > 1 ? `${c}×${p}` : `${p}`))
    .join(" + ");
}

function fmtTime(s) {
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function plateClass(p) {
  return "plate plate--" + String(p).replace(".", "-");
}

function defSets(ex) {
  const arr = [];
  for (let i = 0; i < ex.sets; i++) {
    const w = ex.weight_kg;
    const wStr = w === "bw" || w === "MAX" || w == null ? String(w || "") : String(w);
    arr.push({ w: wStr, r: "", d: false });
  }
  return arr;
}

// Epley 1RM: w * (1 + reps/30)
function epley(w, r) {
  const wn = parseFloat(w);
  const rn = parseInt(r, 10);
  if (!wn || !rn || rn < 1) return null;
  return Math.round(wn * (1 + rn / 30) * 10) / 10;
}

// Find the most recent prior log of an exercise by name
function findLastSession(logs, currentDayKey, exerciseName) {
  // Parse current key: "w3d1" → week 3, day 1
  const m = currentDayKey.match(/w(\d+)d(\d+)/);
  if (!m) return null;
  const curW = parseInt(m[1], 10);
  const curD = parseInt(m[2], 10);

  // Search backwards from current position
  for (let w = curW; w >= 1; w--) {
    const dStart = w === curW ? curD - 1 : 5;
    for (let d = dStart; d >= 1; d--) {
      const key = "w" + w + "d" + d;
      const log = logs[key];
      if (!log) continue;
      // Check each exercise log in this day for matching name
      const dayData = PROGRAM.weeks[String(w)]?.days[String(d)];
      if (!dayData) continue;
      for (let i = 0; i < dayData.exercises.length; i++) {
        if (dayData.exercises[i].name === exerciseName && log[i]?.sets) {
          // Found a prior session — pick first non-empty set
          const completedSets = log[i].sets.filter(s => s.d && s.r);
          if (completedSets.length > 0) {
            return {
              weekKey: key,
              week: w,
              day: d,
              sets: log[i].sets.map(s => ({ w: s.w, r: s.r, d: s.d })),
              completedSets
            };
          }
        }
      }
    }
  }
  return null;
}

function RestTimer({ duration, onClose }) {
  const [remaining, setRemaining] = useState(duration);
  const [paused, setPaused] = useState(false);
  const startRef = useRef(Date.now());
  const intervalRef = useRef(null);

  useEffect(() => {
    if (paused) return;
    intervalRef.current = setInterval(() => {
      const elapsed = Math.floor((Date.now() - startRef.current) / 1000);
      const left = duration - elapsed;
      if (left <= 0) {
        clearInterval(intervalRef.current);
        setRemaining(0);
        try {
          if (typeof navigator !== "undefined" && navigator.vibrate) navigator.vibrate([200, 80, 200]);
        } catch (e) {}
      } else {
        setRemaining(left);
      }
    }, 250);
    return () => clearInterval(intervalRef.current);
  }, [duration, paused]);

  const pct = ((duration - remaining) / duration) * 100;
  const alert = remaining > 0 && remaining <= 5;
  const done = remaining === 0;
  const cls = "timer " + (done ? "timer--done" : alert ? "timer--alert" : "");

  function togglePause() {
    if (paused) {
      startRef.current = Date.now() - (duration - remaining) * 1000;
      setPaused(false);
    } else {
      setPaused(true);
      clearInterval(intervalRef.current);
    }
  }

  return (
    <div className={cls}>
      <div className="timer-info">
        <div className="timer-row">
          <span className="timer-num">{done ? "GO" : fmtTime(remaining)}</span>
          <span className="timer-label">REST {fmtTime(duration)}</span>
        </div>
        <div className="timer-bar">
          <div className="timer-fill" style={{ width: pct + "%" }} />
        </div>
      </div>
      {!done && (
        <button className="timer-btn" onClick={togglePause}>
          {paused ? "▶" : "⏸"}
        </button>
      )}
      <button className="timer-btn" onClick={onClose}>✕</button>
    </div>
  );
}

function PlateModal({ weight, onClose }) {
  const plates = calcPlatesPerSide(weight);
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">Plate Calculator</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="plate-target">
          <div className="plate-target-w">
            {weight}<small>kg total</small>
          </div>
          <div className="plate-target-bar">{BAR_KG} kg bar + plates per side ↓</div>
        </div>
        <div className="plate-side-label">Each side</div>
        {plates === null ? (

        {plates && plates.length > 0 && (
          <div className="plate-target-bar" style={{ textAlign: "center" }}>
            Total: {BAR_KG} + 2×({plates.reduce((a, b) => a + b, 0)}) = {weight} kg
          </div>
        )}
      </div>
    </div>
  );
}

function SetRow({ idx, total, set, onUpdate, onStartTimer, restSec, isAmrap, target, onPlate, isHeavy }) {
  function bumpW(delta) {
    const cur = parseFloat(set.w) || 0;
    const next = Math.max(0, Math.round((cur + delta) * 4) / 4);
    onUpdate({ ...set, w: String(next) });
  }
  function onWChange(e) { onUpdate({ ...set, w: e.target.value }); }
  function onRChange(e) { onUpdate({ ...set, r: e.target.value }); }
  function onDoneToggle() {
    const newDone = !set.d;
    onUpdate({ ...set, d: newDone });
    if (newDone && restSec) onStartTimer(restSec);
  }
  const isLast = idx === total - 1;
  const isText = set.w === "bw" || set.w === "MAX";

  // 1RM estimate on AMRAP set
  const oneRM = isAmrap && isLast && set.r ? epley(set.w, set.r) : null;

  return (
    <>
      {isLast && isAmrap && (
        <div className="set-amrap-flag">
          <span>AMRAP set</span>
          <span className="set-amrap-flag-target">target {target}+ reps</span>
          {oneRM && <span className="set-amrap-1rm">~{oneRM}kg 1RM</span>}
        </div>
      )}
      <div className={"set-row" + (set.d ? " set-row--done" : "") + (isLast && isAmrap ? " set-row--last" : "")}>
        <div className="set-num">S{idx + 1}</div>
        {isText ? (
          <input className="set-w-text" value={set.w} onChange={onWChange} placeholder="kg" />
        ) : (
          <div className="set-w">
            <button className="set-w-btn" onClick={() => bumpW(-2.5)}>−</button>
            <input className="set-w-input" type="number" inputMode="decimal" step="2.5" value={set.w} onChange={onWChange} placeholder="kg" />
            <button className="set-w-btn" onClick={() => bumpW(2.5)}>+</button>
            <button className="set-w-plates" onClick={() => onPlate(parseFloat(set.w) || 0)}>⊟</button>
          </div>
        )}
        <input className="set-r-input" type="number" inputMode="numeric" pattern="[0-9]*" value={set.r} onChange={onRChange} placeholder="reps" />
        <button className={"set-d-btn" + (set.d ? " set-d-btn--done" : "")} onClick={onDoneToggle}>
          {set.d ? "✓" : "○"}
        </button>
      </div>
    </>
  );
}

function ExerciseCard({ ex, idx, log, onUpdateLog, onStartTimer, onPlate, lastSession }) {
  const [open, setOpen] = useState(false);
  const sets = log.sets || defSets(ex);
  const note = log.note || "";
  const completed = sets.filter((s) => s.d).length;
  const total = ex.sets;
  const allDone = completed === total;

  useEffect(() => {
    if (!log.sets) onUpdateLog({ sets: defSets(ex), note: "" });
  }, []);

  function updateSet(i, ns) {
    const arr = sets.slice();
    arr[i] = ns;
    onUpdateLog({ sets: arr, note });
  }
  function updateNote(e) { onUpdateLog({ sets, note: e.target.value }); }

  const isAmrap = ex.target_reps != null;
  const isHeavy = ex.progression === "heavy";

  let cardCls = "ex";
  if (allDone) cardCls += " ex--done";
  if (open) cardCls += " ex--open";

  const wLabel = ex.weight_kg !== "bw" && ex.weight_kg !== "MAX" ? "kg" : "";

  // Last session summary
  let lastSummary = null;
  if (lastSession && lastSession.completedSets.length > 0) {
    const cs = lastSession.completedSets;
    const reps = cs.map(s => s.r).join(", ");
    const w = cs[0].w;
    lastSummary = `Last (W${lastSession.week}D${lastSession.day}): ${w}kg × ${reps}`;
  }
  
  // Estimated 1RM from last AMRAP if available
  let last1RM = null;
  if (isAmrap && lastSession && lastSession.completedSets.length > 0) {
    const last = lastSession.completedSets[lastSession.completedSets.length - 1];
    last1RM = epley(last.w, last.r);
  }

  return (
    <div className={cardCls}>
      <button className="ex-head" onClick={() => setOpen(!open)}>
        <div className="ex-num">{allDone ? "✓" : idx + 1}</div>
        <div className="ex-info">
          <div className="ex-name">
            {ex.name}
            {isHeavy && <span className="ex-meta-tag ex-meta-tag--heavy">Heavy</span>}
            {isAmrap && <span className="ex-meta-tag ex-meta-tag--amrap">AMRAP</span>}
          </div>
          <div className="ex-meta">
            {ex.sets}×{ex.reps} · {ex.weight_kg}{wLabel} · rest {ex.rest}s
          </div>
          {lastSummary && (
            <div className="ex-last">↻ {lastSummary}</div>
          )}
        </div>
        <div className="ex-prog">{completed}/{total}</div>
        <div className="ex-chev">▼</div>
      </button>
      {open && (
        <div className="ex-body">
          <div className="coach-note">
            <b>Coach:</b> {ex.note}
            <small>{ex.rpe} · {ex.rest}s rest between sets</small>
          </div>
          {lastSession && (
            <div className="last-session">
              <div className="last-session-label">Last Session — W{lastSession.week} Day {lastSession.day}</div>
              <div className="last-session-data">
                {lastSession.completedSets.map((s, i) => (
                  <span key={i}>{i > 0 ? ", " : ""}{s.w}×{s.r}</span>
                ))}
                {last1RM && <span className="last-session-1rm">~{last1RM}kg 1RM</span>}
              </div>
            </div>
          )}
          <div className="set-hd">
            <div className="set-hd-num">Set</div>
            <div>Weight</div>
            <div className="set-hd-r">Reps</div>
            <div className="set-hd-d">Done</div>
          </div>
          {sets.map((s, i) => (
            <SetRow
              key={i}
              idx={i}
              total={total}
              set={s}
              restSec={ex.rest}
              isAmrap={isAmrap}
              target={ex.target_reps}
              onUpdate={(ns) => updateSet(i, ns)}
              onStartTimer={onStartTimer}
              onPlate={onPlate}
              isHeavy={isHeavy}
            />
          ))}
          <textarea className="notes-input" rows="2" value={note} onChange={updateNote} placeholder="Notes — how did this feel?" />
        </div>
      )}
    </div>
  );
}

function App() {
  const [week, setWeek] = useState(1);
  const [day, setDay] = useState(1);
  const [logs, setLogs] = useState({});
  const [timerDur, setTimerDur] = useState(null);
  const [plate, setPlate] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [saveMsg, setSaveMsg] = useState("");

  useEffect(() => {
    async function init() {
      try {
        const result = await window_storage.get(STORAGE_KEY);
        if (result && result.value) setLogs(JSON.parse(result.value));
      } catch (e) {}
      setLoaded(true);
    }
    init();
  }, []);

  function save(newLogs) {
    setLogs(newLogs);
    setSaveMsg("saving");
    window_storage.set(STORAGE_KEY, JSON.stringify(newLogs))
      .then((res) => {
        setSaveMsg(res ? "saved" : "fail");
        setTimeout(() => setSaveMsg(""), 1400);
      })
      .catch(() => {
        setSaveMsg("fail");
        setTimeout(() => setSaveMsg(""), 2000);
      });
  }

  if (!loaded) {
    return (
      <div className="wt-root">
        <style>{STYLES}</style>
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
        <div className="loading">Loading…</div>
      </div>
    );
  }

  const wk = PROGRAM.weeks[String(week)];
  const dd = wk.days[String(day)];
  const dayKey = "w" + week + "d" + day;
  const dayLog = logs[dayKey] || {};

  const totalSets = useMemo(() => dd.exercises.reduce((a, x) => a + x.sets, 0), [dd]);
  const doneSets = useMemo(
    () =>
      dd.exercises.reduce((a, x, i) => {
        const eLog = dayLog[i] || {};
        return a + ((eLog.sets || []).filter((s) => s.d).length);
      }, 0),
    [dd, dayLog]
  );
  const dayPct = totalSets > 0 ? Math.round((doneSets / totalSets) * 100) : 0;

  let saveBadge = null;
  if (saveMsg === "saving") saveBadge = <span className="hd-save hd-save--saving">Saving…</span>;
  else if (saveMsg === "saved") saveBadge = <span className="hd-save hd-save--saved">✓ Saved</span>;
  else if (saveMsg === "fail") saveBadge = <span className="hd-save hd-save--fail">Storage error</span>;

  return (
    <div className="wt-root">
      <style>{STYLES}</style>
      <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
      <div className={"app" + (timerDur != null ? " app--with-timer" : "")}>
        <div className="hd">
          <div className="hd-top">
            <div>
              <h1 className="hd-title">
                <span className="hd-title-block">HYBRID — DUP</span>
              </h1>
              <div className="hd-sub">
                W{week} · {wk.title}
                {saveBadge}
              </div>
            </div>
            <div>
              <div className={"hd-pct" + (dayPct === 100 ? " hd-pct--done" : "")}>
                {dayPct}<span style={{ fontSize: 16, opacity: 0.4 }}>%</span>
              </div>
              <div className="hd-pct-label">{doneSets}/{totalSets} sets</div>
            </div>
          </div>
          <div className="weeks">
            {[1, 2, 3, 4, 5, 6, 7, 8].map((w) => {
              const dataW = PROGRAM.weeks[String(w)];
              let wT = 0, wD = 0;
              for (const dn of [1, 2, 3, 4, 5]) {
                const dl = logs["w" + w + "d" + dn] || {};
                const dd2 = dataW.days[String(dn)];
                for (let xi = 0; xi < dd2.exercises.length; xi++) {
                  wT += dd2.exercises[xi].sets;
                  wD += ((dl[xi] && dl[xi].sets) || []).filter((s) => s.d).length;
                }
              }
              const wPct = wT > 0 ? Math.round((wD / wT) * 100) : 0;
              const isComplete = wPct === 100;
              const cls =
                "wk" +
                (week === w ? " wk--active" : "") +
                (isComplete ? " wk--complete" : "");
              return (
                <button key={w} className={cls} onClick={() => { setWeek(w); setDay(1); }}>
                  <div className="wk-num">W{w}</div>
                  <div className="wk-pct">{dataW.title}</div>
                </button>
              );
            })}
          </div>
          <div className="days">
            {[1, 2, 3, 4, 5].map((d) => {
              const dl = logs["w" + week + "d" + d] || {};
              const dd2 = wk.days[String(d)];
              let dT = 0, dD = 0;
              for (let xi = 0; xi < dd2.exercises.length; xi++) {
                dT += dd2.exercises[xi].sets;
                dD += ((dl[xi] && dl[xi].sets) || []).filter((s) => s.d).length;
              }
              const dPct = dT > 0 ? Math.round((dD / dT) * 100) : 0;
              const isComplete = dPct === 100;
              const dayColor = DAY_COLORS[d];
              return (
                <button
                  key={d}
                  className={"dy" + (day === d ? " dy--active" : "") + (isComplete ? " dy--complete" : "")}
                  onClick={() => setDay(d)}
                  style={day === d ? { borderBottomColor: dayColor, color: dayColor } : {}}
                >
                  <div className="dy-label">{DAY_LABELS[d]}</div>
                  <div className="dy-pct">{isComplete ? "✓" : dPct > 0 ? dPct + "%" : "—"}</div>
                </button>
              );
            })}
          </div>
          <div className="day-name">
            <div>{dd.name}</div>
          </div>
          <div className="prog-bar">
            <div
              className={"prog-fill" + (dayPct === 100 ? " prog-fill--done" : "")}
              style={{ width: dayPct + "%", background: dayPct === 100 ? "var(--good)" : `linear-gradient(90deg, ${DAY_COLORS[day]}, ${DAY_COLORS[day]}cc)` }}
            />
          </div>
        </div>
        <div className="ex-list">
          {dd.exercises.map((ex, i) => {
            const lastSession = findLastSession(logs, dayKey, ex.name);
            return (
              <ExerciseCard
                key={dayKey + "-" + i}
                ex={ex}
                idx={i}
                log={dayLog[i] || {}}
                lastSession={lastSession}
                onUpdateLog={(data) => {
                  const newDay = { ...dayLog, [i]: data };
                  save({ ...logs, [dayKey]: newDay });
                }}
                onStartTimer={(r) => setTimerDur(r)}
                onPlate={(w) => w > 0 && setPlate(w)}
              />
            );
          })}
        </div>
        <div className="foot">
          <button
            className="foot-btn"
            onClick={() => {
              if (confirm("Clear today's log? Pre-filled weights restored.")) {
                const nl = { ...logs };
                delete nl[dayKey];
                save(nl);
              }
            }}
          >
            Reset Day
          </button>
          <div className="foot-meta">8-week DUP · 5 days · kg · auto-saves</div>
        </div>
        {timerDur != null && <RestTimer duration={timerDur} onClose={() => setTimerDur(null)} />}
        {plate != null && <PlateModal weight={plate} onClose={() => setPlate(null)} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
